    function saveFcmToken(attempt){
    attempt=attempt||0;
    if(typeof Android==='undefined'||!Android.getFcmToken){
        console.log('Android interface not found');
        return;
    }
    var token=Android.getFcmToken();
    if(!token){
        if(attempt<10){
            console.log('FCM token not ready, retry '+(attempt+1)+'/10...');
            setTimeout(function(){saveFcmToken(attempt+1);},2000);
        }else{
            console.log('FCM token failed after 10 attempts');
        }
        return;
    }
    var phone=$('#login-phone').val()||$.cookie('phone');
    if(!phone){
        console.log('Phone not found');
        return;
    }
    var withPlus=phone[0]==='+';
    phone=phone.replace(/[^0-9]/g,'');
    if(withPlus)phone='+'+phone;
    var phoneBase64=Base64.encode(phone);

    // Записываем в плоский файл /Clients/fcm_token_ТЕЛЕФОН.txt
    var tokenPath='/Clients/fcm_token_'+phoneBase64+'.txt';
    var mainDbx=dbxLk==null?dbx:dbxLk;

    console.log('Saving FCM token to: '+tokenPath);

    mainDbx.filesUpload({path:tokenPath,contents:token,mode:'overwrite'}).then(function(response){
        console.log('FCM token SAVED: '+tokenPath);
    }).catch(function(error){
        console.log('FCM token SAVE ERROR: '+JSON.stringify(error));
    });
}

        var aPanel='';xAccounts.each(function(i,child){var xAcc=$(child);var beginDt=toDate(xAcc.find('BeginDate').text());var endDt=toDate(xAcc.find('EndDate').text());var isUnlimited=xAcc.find('IsUnlimited').text()==='true';var isPerpetual=xAcc.find('IsPerpetual').text()==='true';var showPeriod=!hideEmptyAccountPeriod||xAcc.find('AccountVisits').children().length>0;var withYear=beginDt.getYear()!=endDt.getYear();var beginDtStr=formatDate(beginDt,withYear);var endDtStr=formatDate(endDt,withYear);var accountPeriod=isPerpetual?'Срок действия неограничен':'Действует с '+beginDtStr+' по '+endDtStr;var remainDaysFrom=isPerpetual?'':'<div class="account-count-right gray"> из '+xAcc.find('DaysCount').text()+'</div>';var remainTrainingsFrom=isUnlimited?'':'<div class="account-count-right gray"> из '+xAcc.find('TrainingCount').text()+'</div>';var remainDays=Math.max(0,diffDays(Math.max(today,beginDt),endDt));if(remainDays==0)remainDays='<span class="red">'+remainDays+'</span>';if(isPerpetual)remainDays='∞';var remainTrainings=xAcc.find('RemainTrainingCount').text();if(remainTrainings==0)remainTrainings='<span class="red">'+remainTrainings+'</span>';if(isUnlimited)remainTrainings='∞';accountType=xAcc.find('Type').text();if(accountType){accountCost=accountType.split(' ').splice(-1);}if((remainDays>0||isPerpetual)&&(remainTrainings>0||isUnlimited))hasOpenAccount=true;else hasBadAccount=true;var xGroups=xAcc.find('Groups');var target=xGroups.children().length>0?'':xAcc.find('Target').text();xGroups.children().each(function(j,group){var xGroup=getGroupById($(group).attr('ID'));if(xGroup!=null){var add=j>0?' class="account-period-div"':'';var schedule=xGroup.find('SchedulePreview').text();var gPreview=xGroup.find('ShortPreview').text();target+='<div'+add+'>'+gPreview+' '+schedule+'</div>';}});aPanel+='<div class="account-div">';aPanel+='<div class="account-header-div">';aPanel+='<div class="account-title">Абонемент "'+accountType+'"</div>';if(showPeriod)aPanel+='<div class="gray account-period-div account-dates">'+accountPeriod+'</div>';aPanel+='<div class="gray account-period-div">'+target+'</div>';aPanel+='</div>';aPanel+='<div class="row-wrap-div">';aPanel+='<div class="account-count">';aPanel+='<div class="row-wrap-div">';aPanel+='<div class="account-count-left">'+remainTrainings+'</div>'+remainTrainingsFrom;aPanel+='</div>';aPanel+='<div class="gray">занятий</div>';aPanel+='<div class="gray">осталось</div>';aPanel+='</div>';if(showPeriod){aPanel+='<div class="account-count">';aPanel+='<div class="row-wrap-div">';aPanel+='<div class="account-count-left">'+remainDays+'</div>'+remainDaysFrom;aPanel+='</div>';aPanel+='<div class="gray">дней</div>';aPanel+='<div class="gray">осталось</div>';aPanel+='</div>';}aPanel+='</div></div>';});$('#tabs-1').html(aPanel);updatePayButton();updateBarcode();}

    function updateResPanel(xml,xReservations,resPrev){
        var res=[];if(resPrev==null){xml.find('Reservation').children().each(function(i,child){var xVisit=$(child);if(today<=toDate(xVisit.attr('Date'))){res.push({'date':xVisit.attr('Date'),'time':xVisit.attr('Time'),'targetID':xVisit.attr('TargetID'),'target':xVisit.attr('Target'),'link':xVisit.attr('Link')});}});}else{res=resPrev;}
        if(xReservations!=null){for(var jj=0;jj<xReservations.length;++jj){var xRes=xReservations[jj];var timeStr=xRes.find('Time').text();var date=timeStr.substring(0,10);var time=timeStr.substring(11,17);var groupID=xRes.find('ID_Group');var teacherID=xRes.find('ID_Teacher');var targetID=(groupID.length>0?groupID:teacherID).text();if(today>date)continue;if(xRes.find('Unsubscribe').text()==='True'){for(var kk=res.length-1;kk>=0;--kk){var rk=res[kk];if(rk.date==date&&rk.time==time&&rk.targetID==targetID){res.splice(kk,1);break;}}}else{if(!res.some(x=>x.date===date&&x.time===time&&x.targetID===targetID))res.push({'date':date,'time':time,'targetID':targetID,'target':getGroupById(targetID).find('ShortPreview').text(),'link':''});}}}
        res.sort(function(a,b){var keyA=toDate(a.date),keyB=new toDate(b.date);if(keyA<keyB)return 1;if(keyA>keyB)return-1;return a.time<b.time;});
        var rPanel='<table id="res-tabs">';for(var ii=0;ii<res.length;++ii){var r=res[ii];var dt=formatDate(r.date)+' '+r.time;r.index=ii;rPanel+='<tr class="item-row-big" index="'+ii+'"><td class="res-target-cell trim-text" valign="top">'+dt;rPanel+='<span class="left-margin-min gray"> '+r.target+'</span>';if((zoomShowButton>0&&r.link)||unsubscribe){rPanel+='</td><td class="res-operations-cell"><div>';if(zoomShowButton>0&&r.link){rPanel+='<span class="btn btn-blue" onclick="openZoom(\''+r.link+'\')">Трансляция</span>';}if(unsubscribe){var str=dt+' '+r.target+'<br/><br/>Отписаться от занятия?';var fParams=JSON.stringify(r).replace(new RegExp('"','g'),"'");rPanel+='<span class="btn" onclick="showQuestion(\'Отпись от занятия\', \''+str+'\', runUnsubscribe, '+fParams+')">Отписаться</span>';}rPanel+='</div>';}rPanel+='</td></tr>';}
        if(res.length==0)$('#tabs-4').html('<div class="left-margin gray">Нет записей на занятия</div>');else $('#tabs-4').html(rPanel+'</table>');return res;
    }

    function refreshReservations(){
        var clientID=clientXml.find('ID').text();updateResPanel(clientXml,null);
        dbx.filesDownload({path:summaryPath}).then(function(response){var reader=new FileReader();reader.onload=function(){var lines=reader.result.split('\n');var xReservations=[];for(var ii=0;ii<lines.length;++ii){var xRes=$($.parseXML('<Item>'+lines[ii]+'</Item>'));if(xRes.find('ID_Client').text()===clientID)xReservations.push(xRes);}var res=updateResPanel(clientXml,xReservations);if(dbxLk!=null){dbxLk.filesDownload({path:summaryPath}).then(function(response2){var reader2=new FileReader();reader2.onload=function(){var lines2=reader2.result.split('\n');var xReservations2=[];for(var jj=0;jj<lines2.length;++jj){var xRes2=$($.parseXML('<Item>'+lines2[jj]+'</Item>'));if(xRes2.find('ID_Client').text()===clientID)xReservations2.push(xRes2);}updateResPanel(null,xReservations2,res);};reader2.readAsText(response2.fileBlob);}).catch(function(error){console.log('Ошибка при загрузке сводки записей с другого приложения. '+error);});}};reader.readAsText(response.fileBlob);}).catch(function(error){console.log('Ошибка при загрузке сводки записей. '+error);});
    }

    function fillProfileWin(xml,isChild){
        var phone=$('#login-phone').val();var password=$('#login-pas').val();
        if(usePassword&&passwordType>2&&!isChild){var agreementNumber=xml.find('AgreementNumber').text();var barcode=xml.find('Barcode').text();var badPas=false;if(passwordType===3&&password!=agreementNumber)badPas=true;if(passwordType===4&&password!=barcode.substr(barcode.length-4))badPas=true;if(badPas){showMsg('Внимание','Неверный пароль.');return false;}}
        $.cookie('phone',phone,{expires:30});if(usePassword)$.cookie('password',password,{expires:30});
        $("#profile-tabs").tabs();var clientID=xml.find('ID').text();var currency=' '+xml.find('Currency').text();var balance=xml.find('Balance').text();
        if(showBall){var bonus=xml.find('Bonus').text();if(bonus.length>0&&bonus!=0){if(showBallType===1){balance=parseFloat(balance)+parseFloat(bonus);}else{$('#bonus-sum').text(bonus);$('#bonus-div').css("display","flex");}}}
        $('#fio-header').text(xml.find('FIO').text());$('#balance-sum').text(balance+currency);if(balance!=0)$('#balance-sum').css('color',balance<0?'red':'green');
        updateAccountsPanel(xml);
        var vPanel='<table id="visit-tabs">';var xVisits=xml.find('Visits').children();var xSkips=xml.find('Skips').children();if(xSkips.length>0){xVisits=$.merge(xVisits,xSkips).sort(function(a,b){return toDate($(b).attr('Date'))-toDate($(a).attr('Date'));});}
        xVisits.each(function(i,child){var xVisit=$(child);if(xVisit.attr('IsSkip')==='true'){vPanel+='<tr class="item-row"><td class="date-td trim-text red">'+formatDate(xVisit.attr('Date'));vPanel+='<span class="left-margin-min red"> '+xVisit.attr('Target')+'</span></td>';vPanel+='<td class="trim-cell red"><span>пропуск</span></td></tr>';}else{var accText=xVisit.attr('Account')==='true'?'по абонементу':(xVisit.attr('IsFree')==='true'?'пробное занятие':'разовое занятие');vPanel+='<tr class="item-row"><td class="date-td trim-text">'+formatDate(xVisit.attr('Date'));vPanel+='<span class="left-margin-min gray"> '+xVisit.attr('Target')+'</span></td>';vPanel+='<td class="trim-cell gray"><span>'+accText+'</span></td></tr>';}});
        if(xVisits.length==0)$('#tabs-2').html('<div class="left-margin gray">Нет посещений</div>');else $('#tabs-2').html(vPanel+'</table>');
        var sPanel='<table id="sale-tabs">';var xDeposit=xml.find('Deposit').children();xDeposit.each(function(i,child){var xSale=$(child);sPanel+='<tr class="item-row"><td class="date-td">'+formatDate(xSale.attr('Date'))+'</td>';sPanel+='<td class="left-padding target-td">'+xSale.attr('Target')+'</td>';sPanel+='<td class="left-padding sum-td right-align-td">'+xSale.attr('Sum')+currency+'</td></tr>';});if(xDeposit.length==0)$('#tabs-3').html('<div class="left-margin gray">Нет покупок</div>');else $('#tabs-3').html(sPanel+'</table>');
        saveFcmToken();refreshReservations();preloader.fadeOut('slow');profileWin.dialog({dialogClass:"no-titlebar",width:'100%',show:{effect:'fade',duration:500},hide:{effect:'fade',duration:300},maxHeight:!isPortrait&&!isMobile?700:window.innerHeight,modal:false,create:function(event,ui){$(this).parent().css("maxWidth",isPortrait&&!isMobile?"800px":"600px");}});
    }
